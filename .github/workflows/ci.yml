name: Script & sing-box v1.14.4 Config Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bash syntax check (bash -n)
        run: |
          bash -n singbox.sh
          echo "singbox.sh syntax OK"

      - name: ShellCheck error-level audit
        run: |
          shellcheck -S error singbox.sh
          echo "ShellCheck error-level audit OK"

      - name: Verify embedded Python blocks compile
        run: |
          python3 - << 'PY'
          import re, ast
          src = open("singbox.sh", encoding="utf-8").read()
          blocks = re.findall(r"python3\s+-\s*<<\s*'([A-Z0-9_]+)'[^\n]*\n(.*?)\n\1\b", src, re.S)
          print(f"singbox.sh: Found {len(blocks)} embedded Python blocks")
          assert len(blocks) == 7, f"Expected 7 embedded Python blocks, got {len(blocks)}"
          for idx, (tag, code) in enumerate(blocks, 1):
              ast.parse(code)
              print(f"  Block #{idx} ({tag}): syntax OK")
          PY

      - name: Validate client.json with official sing-box v1.14.4
        run: |
          SB_VER="1.14.4"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" version
          "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" check -c client.json
          echo "client.json passed sing-box v1.14.4 check"
